version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/notificationService"
    runOptions:
      $ref: "#/components/runOptions/notificationService"
components:
  sources:
    localSpecs:
      filesystem:
        directory: specs
  services:
    notificationService:
      description: "Notification Service"
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/localSpecs"
            specs:
              - spec:
                  path: "openapi.yaml"
              - spec:
                  path: "asyncapi.yaml"
  runOptions:
    notificationService:
      openapi:
        type: test
        filter: "${FILTER:STATUS >= '0'}"
        host: localhost
        port: 8080
      asyncapi:
        type: test
        servers:
          - host: localhost:9092
            protocol: kafka
